server:
  port: 8100
  max-http-request-header-size: 500KB
  tomcat:
    connection-timeout: 70000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
spring:
  profiles:
    active: '@profiles.active@'
  application:
    name: core-backend
  messages:
    encoding: UTF-8
  main:
    allow-circular-references: true
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache/ehcache.xml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
  jackson:
    parser:
      allow-numeric-leading-zeros: true
management:
  health:
    redis:
      enabled: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  file:
    path: /opt/dataease2.0/logs/dataease
# sql日志生产环境注释掉
#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

quartz:
  enabled: true
  scheduler-name: deSyncJob

company:
  bi:
    auth:
      enabled: true
    bootstrap-username: admin
    bootstrap-display-name: 系统管理员
    # 仅从环境变量读取，禁止把真实密码写入仓库
    bootstrap-password: ${COMPANY_BI_BOOTSTRAP_PASSWORD:}
    token-secret: ${COMPANY_BI_TOKEN_SECRET:}
    data-dir: ${dataease.path.data:/opt/dataease2.0/data}
  feishu:
    node: ${COMPANY_BI_INTEGRATION_NODE:node}
    worker-dir: ${COMPANY_BI_INTEGRATION_WORKER_DIR:/opt/apps/integration-worker}
    shot-base-url: ${COMPANY_FEISHU_SHOT_BASE_URL:http://127.0.0.1:8091}
    internal-token: ${COMPANY_FEISHU_INTERNAL_TOKEN:}
    dry-run: ${COMPANY_FEISHU_DRY_RUN:false}
    connect-timeout-ms: ${COMPANY_FEISHU_CONNECT_TIMEOUT_MS:15000}

dataease:
  version: '@project.version@'
  login_timeout: 2880
  xpack-front-distributed: true
  origin-list: http://localhost:8080
  apisix-api:
    domain: http://127.0.0.1:9180
    key: edd1c9f034335f136f87ad84b625c8f1

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    #operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: false
