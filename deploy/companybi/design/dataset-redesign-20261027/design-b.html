function matches(row,key,r){const v=row[key];if(r.mode==='values')return r.op==='exclude'?!r.values.includes(String(v)):r.values.includes(String(v));if(r.mode==='range')return (r.min===''||Number(v)>=Number(r.min))&&(r.max===''||Number(v)<=Number(r.max));if(r.mode==='date')return (!r.min||String(v)>=r.min)&&(!r.max||String(v)<=r.max);if(r.condition==='empty')return v==null||v==='';if(r.condition==='notempty')return v!=null&&v!=='';if(r.condition==='equals')return String(v)===r.value;return String(v).includes(r.value)}
function filtered(rules=state.rules,logic=state.logic){const all=used(rules);return rows.filter(row=>!all.length||(logic==='and'?all.every(([k,r])=>matches(row,k,r)):all.some(([k,r])=>matches(row,k,r))))}

function filterFooter(){return `<footer class="filter-footer"><div class="scope-note">${icon('eye')}仅影响预览与本页导出</div><div>${button('取消','cancel-filter','secondary')}${button('应用筛选','apply-filter','primary')}</div></footer>`}
function filterPanel(){if(!state.filterOpen||state.view==='model')return '';if(variant==='a')return `<aside class="filter-inspector"><div class="inspector-heading"><div><span class="eyebrow">DATA FILTER</span><h2>筛选数据${activeCount()?`<small>${activeCount()}</small>`:''}</h2></div>${iconButton('close','cancel-filter','收起筛选面板')}</div><div class="filter-inspector-scroll" data-scroll="inspector">${ruleHeader()}${valueEditor()}<div class="draft-rule-links">${used(state.draft).length?`<span>已配置 ${used(state.draft).length} 个字段</span>${button('查看规则','show-rules','text')}`:'<span>选择字段后可直接查看它的所有值</span>'}</div></div>${filterFooter()}</aside>`;
 if(variant==='b'){const a=state.anchor||{left:320,bottom:240};return `<section class="filter-popover" style="left:${Math.min(a.left,window.innerWidth-662)}px;top:${Math.min(a.bottom+8,window.innerHeight-570)}px" aria-label="字段值筛选"><div class="popover-heading"><div>${typeMark(byKey(state.activeField))}<strong>${esc(byKey(state.activeField).label)}</strong><code>${state.activeField}</code></div>${iconButton('close','cancel-filter','关闭筛选')}</div><div class="popover-body"><div class="popover-editor">${valueEditor()}</div>${selectedSummary()}</div>${filterFooter()}</section>`}
 return `<div class="modal-scrim" data-action="modal-backdrop"><section class="filter-studio" role="dialog" aria-modal="true" aria-label="筛选工作室"><header class="studio-heading"><div><span class="eyebrow">FILTER STUDIO</span><h2>筛选数据</h2><p>选择字段，查看值，再应用到当前预览。</p></div>${iconButton('close','cancel-filter','关闭筛选工作室')}</header><div class="studio-body"><aside class="studio-fields"><label class="search-box">${icon('search')}<input id="studio-field-search" data-bind="studio-field-search" placeholder="查找字段" value="${esc(state.studioSearch||'')}"/></label><div data-scroll="studio-fields">${fields.filter(f=>[f.key,f.label].some(v=>v.toLowerCase().includes((state.studioSearch||'').toLowerCase()))).map(f=>`<button class="studio-field ${state.activeField===f.key?'active':''}" data-action="studio-field" data-key="${f.key}">${typeMark(f)}<span>${esc(f.label)}<small>${f.key}</small></span>${state.draft[f.key]&&used({[f.key]:state.draft[f.key]}).length?'<i></i>':''}</button>`).join('')}</div></aside><section class="studio-editor"><div class="studio-current"><strong>${esc(byKey(state.activeField).label)}</strong><code>${state.activeField}</code><span>${new Set(rows.map(r=>String(r[state.activeField]))).size} 个不同值</span></div>${valueEditor()}</section><aside class="studio-summary"><label class="logic-select">规则关系<select data-bind="draft-logic"><option value="and" ${state.draftLogic==='and'?'selected':''}>全部满足 · AND</option><option value="or" ${state.draftLogic==='or'?'selected':''}>任一满足 · OR</option></select></label>${selectedSummary()}</aside></div>${filterFooter()}</section></div>`}

function columnDialog(){if(!state.columnsOpen)return '';const match=fields.filter(f=>[f.key,f.label].some(x=>x.toLowerCase().includes(state.columnSearch.toLowerCase())));return `<div class="modal-scrim"><section class="columns-dialog" role="dialog" aria-modal="true" aria-label="设置显示列"><header><div><h2>设置显示列</h2><p>同时用于当前表格和本页导出。</p></div>${iconButton('close','cancel-columns','关闭显示列设置')}</header><label class="search-box">${icon('search')}<input id="column-search" data-bind="column-search" placeholder="搜索字段名称或原始名" value="${esc(state.columnSearch)}"/></label><div class="columns-toolbar">${button('选择匹配字段','select-matching-columns','text')}${button('取消匹配字段','unselect-matching-columns','text')}<span>已选 ${state.columnDraft.length} / ${fields.length}</span></div><div class="columns-options" data-scroll="columns">${match.map(f=>`<label><input type="checkbox" data-bind="column-check" value="${f.key}" ${state.columnDraft.includes(f.key)?'checked':''}/>${typeMark(f)}<span>${esc(f.label)}<small>${f.key}</small></span></label>`).join('')}</div><footer><span>至少保留一列</span><div>${button('取消','cancel-columns','secondary')}${button('应用显示列','apply-columns','primary')}</div></footer></section></div>`}
function detailDialog(){if(!state.detail)return '';return `<div class="modal-scrim"><section class="detail-dialog" role="dialog" aria-label="原始值"><header><div><span class="eyebrow">ORIGINAL VALUE</span><h2>${esc(state.detail.label)}</h2><code>${esc(state.detail.key)}</code></div>${iconButton('close','close-detail','关闭原始值')}</header><pre>${esc(state.detail.value)}</pre><footer><span>原始值未做显示格式转换</span>${button(icon('copy')+'复制原始值','copy-detail','secondary')}</footer></section></div>`}
function utilityDialog(){if(!state.utility)return '';return `<div class="modal-scrim"><section class="detail-dialog utility-dialog" role="dialog"><header><div><span class="eyebrow">DATASET FIELD</span><h2>${state.utility==='group'?'新建分组字段':state.utility==='sql'?'自定义 SQL':'新建计算字段'}</h2></div>${iconButton('close','close-utility','关闭字段编辑')}</header><label>字段名称<input placeholder="例如：销售额（万元）"/></label><label>${state.utility==='sql'?'SQL':'表达式'}<textarea rows="5">${state.utility==='sql'?'SELECT *\nFROM fact_sales_detail':'[m] / 10000'}</textarea></label><div class="formula-fields"><span>可引用字段</span>${['m','sales_qty','taste_name'].map(k=>`<code>${k}</code>`).join('')}</div><footer><span>编辑器交互示意</span>${button('完成','finish-utility','primary')}</footer></section></div>`}
function render(){const focus=document.activeElement?.id,selection=document.activeElement?.selectionStart;const scrolls={};document.querySelectorAll('[data-scroll]').forEach(e=>scrolls[e.dataset.scroll]=[e.scrollTop,e.scrollLeft]);$('#app').innerHTML=pageHeader()+`<div class="workspace-top">${viewTabs()}<div class="dataset-meta"><span>${icon('database')}MySQL · 销售数据仓库</span><i></i><span>110 行 · 36 字段</span>${variant==='c'?pill('预览不会更改数据集','scope-pill'):''}</div></div><main class="workspace ${state.filterOpen&&variant==='a'?'inspector-open':''} ${state.fieldsOpen?'fields-open':''}">${fieldPanel()}<section class="data-pane">${state.view==='model'?modelView():state.view==='structure'?structureView():`${variant!=='a'?chips():''}${toolbar()}${activeCount()&&variant==='a'?chips():''}${tableView()}`}</section>${variant==='a'?filterPanel():''}</main>${variant!=='a'?filterPanel():''}${columnDialog()}${detailDialog()}${utilityDialog()}<div class="toast" role="status" aria-live="polite"></div>`;document.querySelectorAll('[data-scroll]').forEach(e=>{const p=scrolls[e.dataset.scroll];if(p){e.scrollTop=p[0];e.scrollLeft=p[1]}});if(focus){const el=document.getElementById(focus);if(el){el.focus();if(typeof selection==='number')try{el.setSelectionRange(selection,selection)}catch{}}}}
let toastTimer;
function toast(message){clearTimeout(toastTimer);const e=$('.toast');e.textContent=message;e.classList.add('show');toastTimer=setTimeout(()=>e.classList.remove('show'),2600)}
function openFilter(key,anchor){state.menu='';state.activeField=key||state.activeField;state.valueSearch='';state.valueTab='list';state.paste='';state.draft=copy(state.rules);state.draftLogic=state.logic;draftRule();state.filterOpen=true;state.anchor=anchor?.getBoundingClientRect();render()}
function applyFilter(){for(const [,r]of used(state.draft)){if(r.mode==='range'&&r.min!==''&&r.max!==''&&Number(r.min)>Number(r.max)){toast('最小值不能大于最大值');return}if(r.mode==='date'&&r.min&&r.max&&r.min>r.max){toast('开始日期不能晚于结束日期');return}}state.rules=Object.fromEntries(used(state.draft));state.logic=state.draftLogic;state.page=1;state.filterOpen=variant==='a';render();toast(`筛选已应用，当前 ${filtered().length} 行 · 导出使用相同条件`)}
function exportCsv(){const cols=state.columns.map(byKey);const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const csv='\ufeff'+[cols.map(f=>quote(f.label)).join(','),...filtered().map(row=>cols.map(f=>quote(row[f.key])).join(','))].join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='系列排名_设计预览.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);state.menu='';render();toast(`已导出 ${filtered().length} 行、${cols.length} 列示例数据`)}

$('#app').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,k=el.dataset.key,v=el.dataset.value;if(a==='open-filter'||a==='filter-field'){openFilter(k,el);return}if(a==='apply-filter'){applyFilter();return}if(a==='cancel-filter'){state.filterOpen=false;render();return}if(a==='view'){state.view=v;state.filterOpen=false;state.menu='';render();return}if(a==='toggle-fields'){state.fieldsOpen=!state.fieldsOpen;render();return}if(a==='field-tab'){state.fieldTab=v;render();return}if(a==='group'){state.collapsed[k]=!state.collapsed[k];render();return}if(a==='clear-field-search'){state.fieldSearch='';render();return}if(a==='field-focus'){state.focusedColumn=k;if(!state.columns.includes(k)){state.columns.push(k);render()}else render();const head=document.querySelector(`[data-column="${k}"]`);head?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});return}if(a==='clear-rules'){state.rules={};state.draft={};state.page=1;render();return}if(a==='studio-field'){state.activeField=k;state.valueSearch='';state.paste='';state.valueTab='list';draftRule();render();return}if(a==='rule-op'){draftRule().op=v;render();return}if(a==='rule-mode'){draftRule().mode=v;render();return}if(a==='value-tab'){state.valueTab=v;state.paste=draftRule().values.join('\n');render();return}if(a==='clear-active'){const r=draftRule();r.values=[];r.min='';r.max='';r.value='';render();return}if(a==='clear-value-search'){state.valueSearch='';render();return}if(a==='use-paste'){draftRule().values=[...new Set([...draftRule().values,...state.paste.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)])];state.valueTab='list';render();return}if(a==='range-preset'){draftRule().min=el.dataset.min||'';draftRule().max=el.dataset.max||'';render();return}if(a==='date-month'){draftRule().min='2026-10-01';draftRule().max='2026-10-31';render();return}if(a==='remove-draft-rule'){delete state.draft[k];render();return}if(a==='show-rules'){toast(used(state.draft).map(([key,r])=>byKey(key).label+'：'+summary(key,r)).join('；'));return}if(a==='columns'||a==='bulk-fields'){state.columnsOpen=true;state.columnDraft=[...state.columns];state.columnSearch='';state.menu='';render();return}if(a==='cancel-columns'){state.columnsOpen=false;render();return}if(a==='select-matching-columns'||a==='unselect-matching-columns'){const keys=fields.filter(f=>[f.key,f.label].some(x=>x.toLowerCase().includes(state.columnSearch.toLowerCase()))).map(f=>f.key);state.columnDraft=a==='select-matching-columns'?[...new Set([...state.columnDraft,...keys])]:state.columnDraft.filter(k=>!keys.includes(k));render();return}if(a==='apply-columns'){if(!state.columnDraft.length){toast('请至少保留一列');return}state.columns=fields.filter(f=>state.columnDraft.includes(f.key)).map(f=>f.key);state.columnsOpen=false;render();return}if(a==='menu-field'||a==='menu-export'){state.menu=state.menu===(a==='menu-field'?'field':'export')?'':a==='menu-field'?'field':'export';render();return}if(a==='export-csv'){exportCsv();return}if(a==='export-excel'){state.menu='';render();toast('Excel 将使用同一组行筛选和显示列；此处展示导出入口');return}if(a==='prev-page'||a==='next-page'){state.page+=a==='next-page'?1:-1;render();$('.table-scroll').scrollTop=0;return}if(a==='close-detail'){state.detail=null;render();return}if(a==='copy-detail'){navigator.clipboard?.writeText(String(state.detail.value)).then(()=>toast('原始值已复制')).catch(()=>toast('可在面板中选中文字复制'));return}if(a==='new-calc'||a==='new-group'||a==='new-sql'){state.utility=a==='new-group'?'group':a==='new-sql'?'sql':'calc';state.menu='';render();return}if(a==='close-utility'||a==='finish-utility'){state.utility=null;render();if(a==='finish-utility')toast('字段编辑交互已演示，未修改现有 BI');return}if(a==='refresh'){render();toast('预览已刷新，筛选和显示列保持不变');return}if(a==='save'||a==='back'){toast('当前为设计原型，未修改现有 BI');return}if(a==='join-info'){toast('左关联：销售明细.sku_id = 商品维表.sku_id');return}});
$('#app').addEventListener('input',e=>{const b=e.target.dataset.bind,v=e.target.value;if(b==='field-search')state.fieldSearch=v;else if(b==='value-search')state.valueSearch=v;else if(b==='column-search')state.columnSearch=v;else if(b==='studio-field-search')state.studioSearch=v;else if(b==='range-min')draftRule().min=v;else if(b==='range-max')draftRule().max=v;else if(b==='condition-value')draftRule().value=v;else if(b==='paste'){state.paste=v;return}else return;render()});
$('#app').addEventListener('change',e=>{const b=e.target.dataset.bind,v=e.target.value;if(b==='active-field'){state.activeField=v;state.valueSearch='';state.valueTab='list';draftRule()}else if(b==='value-check'){const r=draftRule();r.values=e.target.checked?[...new Set([...r.values,v])]:r.values.filter(x=>x!==v)}else if(b==='all-values'){const r=draftRule(),values=optionsFor(state.activeField).map(o=>o.value);r.values=e.target.checked?[...new Set([...r.values,...values])]:r.values.filter(v=>!values.includes(v))}else if(b==='column-check'){state.columnDraft=e.target.checked?[...state.columnDraft,v]:state.columnDraft.filter(x=>x!==v)}else if(b==='quick-column'){if(!e.target.checked&&state.columns.length===1){toast('至少保留一列');e.target.checked=true;return}state.columns=e.target.checked?[...state.columns,v]:state.columns.filter(x=>x!==v)}else if(b==='page-size'){state.pageSize=Number(v);state.page=1}else if(b==='draft-logic')state.draftLogic=v;else if(b==='condition-op')draftRule().condition=v;else return;render()});
$('#app').addEventListener('dblclick',e=>{const cell=e.target.closest('[data-cell]');if(!cell)return;const row=filtered()[Number(cell.dataset.cell)],f=byKey(cell.dataset.key);state.detail={key:f.key,label:f.label,value:String(row[f.key])};render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.filterOpen=false;state.columnsOpen=false;state.detail=null;state.utility=null;state.menu='';render()}});
document.addEventListener('click',e=>{if(variant==='b'&&state.filterOpen&&!e.target.closest('.filter-popover')&&!e.target.closest('[data-action="filter-field"]')&&!e.target.closest('[data-action="open-filter"]')){state.filterOpen=false;render()}});
render();
if(new URL(location.href).searchParams.get('filter')==='1'||variant==='a')setTimeout(()=>openFilter('taste_name',$('[data-action="open-filter"]')),30);
</script></body></html>
